# Owner from wave 1 on: integrator (see ORCHESTRIERUNG.md section 5)
# flake8/isort settings copied from pretix-plugin-cookiecutter (HEAD 9ef6054),
# extended only by the excludes described in docs/adr/0000-setup.md.
[flake8]
ignore = N802,W503,E402
max-line-length = 160
exclude = .git,__pycache__,migrations,.ropeproject,static,_static,build,dist,setup.py,scripts,.claude

[isort]
profile = black
combine_as_imports = true
default_section = THIRDPARTY
include_trailing_comma = true
known_third_party = pretix
known_standard_library = typing
skip = setup.py
skip_glob = scripts/**,.claude/**,build/**,dist/**,*/migrations/*
use_parentheses = True
force_grid_wrap = 0
line_length = 88
known_first_party = pretix_custom_reports

[tool:pytest]
DJANGO_SETTINGS_MODULE = pretix.testutils.settings
addopts = -rw
markers =
    performance: slow load/performance tests, deselect with -m "not performance"

[coverage:run]
source = pretix_custom_reports
omit = */migrations/*,*/urls.py,*/tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __str__
    def __repr__
    if settings.DEBUG
    NOQA
    NotImplementedError

[check-manifest]
ignore =
    .update-locales.sh
    .install-hooks.sh
    .claude/**
    pretixplugin.toml
    Makefile
    manage.py
    tests/*
    tests/**
    docs/**
    handoff/**
    scripts/**
    *.md
    *.po
    .gitkeep
